[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-for-capra"
version = "0.1.0"
description = "Independent, offline-capable black-box CAPRA / RedAgent benchmark"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
capra-benchmark = "evaluator.cli:main"

[tool.setuptools.packages.find]
include = ["evaluator*", "schemas*"]

[tool.setuptools.package-data]
schemas = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires explicitly enabled local external service"]
