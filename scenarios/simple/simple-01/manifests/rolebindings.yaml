apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webapp-benchmark
  namespace: application
subjects:
  - kind: ServiceAccount
    name: webapp
    namespace: application
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webapp-benchmark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-production-reader
  namespace: production
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: application
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: production-secret-reader
