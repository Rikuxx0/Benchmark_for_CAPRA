apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webapp-benchmark
  namespace: application
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["deployer-credential"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["public-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: production-secret-reader
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["production-db-secret"]
    verbs: ["get"]
